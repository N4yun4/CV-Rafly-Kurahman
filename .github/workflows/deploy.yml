name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Izin yang dibutuhkan GitHub Pages untuk menerbitkan hasil build.
permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu proses deploy yang berjalan pada satu waktu.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build situs statis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Periksa ESLint
        run: npm run lint

      - name: Periksa TypeScript
        run: npm run typecheck

      # URL Pages dihitung langsung dari nama owner & repository supaya build tidak
      # bergantung pada status aktivasi Pages (owner selalu huruf kecil pada github.io).
      - name: Tentukan URL GitHub Pages
        id: pages
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="${{ github.event.repository.name }}"
          echo "base_path=/$repo" >> "$GITHUB_OUTPUT"
          echo "base_url=https://$owner.github.io/$repo" >> "$GITHUB_OUTPUT"
          echo "Situs akan tayang di https://$owner.github.io/$repo/"

      - name: Build (static export)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      # Mencegah GitHub memproses folder _next dengan Jekyll.
      - name: Tambahkan .nojekyll
        run: touch out/.nojekyll

      - name: Unggah artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy ke GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
